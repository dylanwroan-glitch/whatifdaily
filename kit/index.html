<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;background:#000;overflow:hidden}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden}
  canvas{position:absolute;left:0;top:0;width:1080px;height:1920px}
  #hud{position:absolute;inset:0;pointer-events:none;color:#fff;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
  .chip{position:absolute;font-weight:700;font-size:25px;letter-spacing:.16em;padding:13px 24px;border-radius:40px;
        background:rgba(8,10,16,.42);border:1.5px solid rgba(255,255,255,.16);backdrop-filter:blur(6px);white-space:nowrap}
  #loc{left:64px;top:150px;opacity:0;display:flex;align-items:center;gap:14px}
  #loc .dot{width:13px;height:13px;border-radius:50%;background:#ff4b3e;box-shadow:0 0 14px #ff4b3e}
  #tag{left:50%;top:438px;transform:translateX(-50%);opacity:0;color:#f3b083;border-color:rgba(243,176,131,.35)}
  #gauge{position:absolute;right:64px;top:132px;width:292px;opacity:0;text-align:right}
  #gauge .gl{font-weight:700;font-size:20px;letter-spacing:.18em;opacity:.78}
  #gv{font-family:'Inter Display','Inter';font-weight:800;font-size:60px;line-height:1.05;font-variant-numeric:tabular-nums;color:#f6b487;text-shadow:0 2px 16px rgba(0,0,0,.6)}
  #gauge.zero #gv{color:#ff6a5a}
  #gauge .bar{height:9px;border-radius:9px;background:rgba(255,255,255,.16);overflow:hidden;margin-top:8px}
  #gb{height:100%;width:100%;transform-origin:left;background:linear-gradient(90deg,#b4532a,#f0a26a,#ffd2a8)}
  #clock{position:absolute;left:0;right:0;top:262px;text-align:center;opacity:0}
  #ct{font-family:'Inter Display','Inter';font-weight:800;font-size:104px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em;text-shadow:0 4px 26px rgba(0,0,0,.55)}
  #cl{margin-top:12px;font-weight:700;font-size:23px;letter-spacing:.24em;color:#f3b083;text-shadow:0 2px 10px rgba(0,0,0,.6)}
  #count{position:absolute;left:50%;top:50%;font-family:'Inter Display','Inter';font-weight:900;font-size:420px;line-height:1;opacity:0;
         text-shadow:0 0 60px rgba(255,170,110,.55),0 10px 40px rgba(0,0,0,.5)}
  #title{position:absolute;left:80px;right:80px;top:300px;text-align:center;font-family:'Lora',serif;font-weight:500;font-size:84px;line-height:1.1;opacity:0;
         text-shadow:0 4px 30px rgba(0,0,0,.65)}
  #title em{font-style:italic;color:#f6b487}
  #cap{position:absolute;left:40px;right:40px;top:1110px;padding:50px 44px;text-align:center;opacity:0;background:radial-gradient(ellipse at center,rgba(0,0,0,.42) 0%,rgba(0,0,0,.18) 55%,rgba(0,0,0,0) 75%)}
  #capTxt{font-weight:800;font-size:64px;line-height:1.13;letter-spacing:-.01em;text-shadow:0 4px 22px rgba(0,0,0,.75),0 0 2px rgba(0,0,0,.9)}
  #capTxt b{color:#f6b487;font-weight:900}
  #src{margin-top:22px;font-weight:700;font-size:23px;letter-spacing:.14em;opacity:.78;text-shadow:0 2px 10px rgba(0,0,0,.8)}
  #end{position:absolute;left:70px;right:70px;top:760px;text-align:center;opacity:0}
  #end .e1{font-family:'Lora',serif;font-weight:600;font-size:92px;line-height:1.08;text-shadow:0 6px 34px rgba(0,0,0,.7)}
  #end .e2{margin-top:30px;font-weight:800;font-size:40px;letter-spacing:.06em;color:#f6b487;text-shadow:0 3px 16px rgba(0,0,0,.7)}
</style></head>
<body>
<div id="stage">
  <canvas id="c" width="1080" height="1920"></canvas>
  <div id="hud">
    <div id="loc" class="chip"><span class="dot"></span><span>NEW YORK CITY · 9:41 PM</span></div>
    <div id="gauge"><div class="gl">COPPER ON EARTH</div><div id="gv">100%</div><div class="bar"><div id="gb"></div></div></div>
    <div id="clock"><div id="ct">T+0.00 s</div><div id="cl"></div></div>
    <div id="tag" class="chip"></div>
    <div id="count"></div>
    <div id="title">What if all <em>copper</em> disappeared for 5&nbsp;seconds?</div>
    <div id="cap"><div id="capTxt"></div><div id="src"></div></div>
    <div id="end"><div class="e1">What should disappear next?</div><div class="e2">COMMENT IT ↓</div></div>
  </div>
</div>
<script type="module">
  import { setup, renderAt, SHOTS, DURATION, FPS } from './scene.js';
  window.__ready = false;
  (async () => {
    try {
      await document.fonts.load('800 64px Inter'); await document.fonts.load('500 84px Lora'); await document.fonts.load('italic 500 84px Lora'); await document.fonts.load('800 100px "Inter Display"');
      const q = new URLSearchParams(location.search);
      const w = +(q.get('w') || 1080), hh = +(q.get('h') || 1920);
      window.__info = await setup(document.getElementById('c'), w, hh, { msaa: +(q.get('msaa') ?? 4), reflDiv: +(q.get('refl') || 2), prepass: q.get('pre') === '1' });
      window.renderAt = (t) => renderAt(t);
      window.__meta = { SHOTS, DURATION, FPS };
      window.__ready = true;
    } catch (e) { window.__err = String(e && e.stack || e); }
  })();
</script>
</body></html>
