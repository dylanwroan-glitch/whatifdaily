<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face{font-family:'Luckiest';src:url('LuckiestGuy.woff2') format('woff2')}
  @font-face{font-family:'Bangers';src:url('Bangers.woff2') format('woff2')}
  @font-face{font-family:'Montserrat';font-weight:900;src:url('Montserrat-900.woff2') format('woff2')}
  html,body{margin:0;background:#000;overflow:hidden}
  canvas{display:block;width:1080px;height:1920px}
</style></head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
  import { setup, renderAt, META } from './scene.js';
  window.__ready = false;
  (async () => {
    try {
      await document.fonts.load('80px Luckiest'); await document.fonts.load('80px Bangers'); await document.fonts.load('900 60px Montserrat');
      setup(document.getElementById('c'));
      window.renderAt = renderAt; window.__meta = META; window.__ready = true;
    } catch (e) { window.__err = String(e && e.stack || e); }
  })();
</script>
</body></html>
