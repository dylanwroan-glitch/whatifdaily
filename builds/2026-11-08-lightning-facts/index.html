<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;background:#000;overflow:hidden}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden}
  canvas{position:absolute;left:0;top:0;width:1080px;height:1920px}
  #hud{position:absolute;inset:0;pointer-events:none;color:#fff;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
  .chip{position:absolute;font-weight:700;font-size:25px;letter-spacing:.16em;padding:13px 24px;border-radius:40px;
        background:rgba(8,10,16,.45);border:1.5px solid rgba(255,255,255,.18);white-space:nowrap}
  #title{position:absolute;left:90px;right:150px;top:250px;text-align:center;font-family:'Lora',serif;font-weight:600;font-size:92px;line-height:1.08;
         text-shadow:0 4px 30px rgba(0,0,0,.8),0 0 3px rgba(0,0,0,.9)}
  #title em{font-style:italic;color:#ffd45e}
  #guess{left:50%;top:530px;transform:translateX(-50%);opacity:0;color:#ffd45e;border-color:rgba(255,212,94,.45);font-size:34px;padding:16px 32px}
  #dots{position:absolute;left:0;right:0;top:132px;display:flex;justify-content:center;gap:22px;opacity:0}
  .dot{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:30px;
       background:rgba(8,10,16,.5);border:3px solid rgba(255,255,255,.28);color:rgba(255,255,255,.7);box-sizing:border-box}
  .dot.cur{border-color:#fff;color:#fff;transform:scale(1.12)}
  .dot.myth{background:#e5342b;border-color:#ff8a80;color:#fff}
  .dot.true{background:#1fa64a;border-color:#8ff0a8;color:#fff}
  #counter{position:absolute;left:0;right:0;top:240px;text-align:center;opacity:0}
  #cv{font-family:'Inter Display','Inter';font-weight:800;font-size:150px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em;
      text-shadow:0 4px 30px rgba(0,0,0,.7)}
  #cv b{color:#ffd45e;font-weight:800}
  #cl{margin-top:10px;font-weight:700;font-size:25px;letter-spacing:.22em;color:#bcd3ff;text-shadow:0 2px 10px rgba(0,0,0,.8)}
  #mode{left:50%;top:470px;transform:translateX(-50%);opacity:0;color:#bcd3ff;border-color:rgba(188,211,255,.4)}
  #claim{position:absolute;left:100px;right:150px;top:1090px;padding:40px 46px 46px;border-radius:34px;text-align:center;opacity:0;
         background:rgba(6,8,14,.62);border:2px solid rgba(255,255,255,.14)}
  #cn{font-weight:800;font-size:26px;letter-spacing:.2em;color:#ffd45e}
  #ct{margin-top:18px;font-family:'Lora',serif;font-style:italic;font-weight:600;font-size:62px;line-height:1.14}
  #stamp{position:absolute;left:515px;top:1250px;font-family:'Inter Display','Inter';font-weight:900;font-size:170px;letter-spacing:.06em;line-height:1;
         padding:18px 46px 22px;border:12px solid currentColor;border-radius:26px;opacity:0;white-space:nowrap;
         transform:translate(-50%,-50%) rotate(-9deg);text-shadow:0 0 30px rgba(0,0,0,.45);background:rgba(0,0,0,.18)}
  #stamp.myth{color:#ff3b30}
  #stamp.true{color:#34d860}
  #cap{position:absolute;left:90px;right:150px;top:1110px;padding:50px 44px;text-align:center;opacity:0;
       background:radial-gradient(ellipse at center,rgba(0,0,0,.5) 0%,rgba(0,0,0,.22) 55%,rgba(0,0,0,0) 76%)}
  #capTxt{font-weight:800;font-size:66px;line-height:1.13;letter-spacing:-.01em;text-shadow:0 4px 22px rgba(0,0,0,.8),0 0 2px rgba(0,0,0,.9)}
  #capTxt b{color:#ffd45e;font-weight:900}
  #src{margin-top:22px;font-weight:700;font-size:23px;letter-spacing:.14em;opacity:.82;text-shadow:0 2px 10px rgba(0,0,0,.85)}
  .lab{position:absolute;transform:translate(-50%,-50%);font-weight:900;font-size:44px;letter-spacing:.08em;color:#ffd45e;white-space:nowrap;opacity:0;
       text-shadow:0 3px 18px rgba(0,0,0,.9),0 0 3px rgba(0,0,0,1)}
  .lab.small{font-size:28px;color:#fff;letter-spacing:.16em}
  #bars{position:absolute;left:90px;right:262px;top:170px;opacity:0}
  .br{margin-bottom:26px}
  .bl{font-weight:800;font-size:26px;letter-spacing:.16em;text-shadow:0 2px 10px rgba(0,0,0,.8)}
  .bt{position:relative;height:40px;margin-top:10px;border-radius:22px;background:rgba(255,255,255,.12)}
  .bf{position:absolute;left:0;top:0;bottom:0;border-radius:22px;transform-origin:left}
  .bv{position:absolute;right:-118px;top:-6px;font-family:'Inter Display','Inter';font-weight:900;font-size:46px}
  #b1 .bf{background:linear-gradient(90deg,#ff7a1a,#ffc24a)}
  #b2 .bf{background:linear-gradient(90deg,#7fa8ff,#e8f0ff)}
  #end{position:absolute;left:70px;right:70px;top:700px;text-align:center;opacity:0}
  #end .e1{font-family:'Lora',serif;font-weight:600;font-size:100px;line-height:1.06;text-shadow:0 6px 34px rgba(0,0,0,.8)}
  #end .e2{margin-top:34px;font-weight:800;font-size:42px;letter-spacing:.08em;color:#ffd45e;text-shadow:0 3px 16px rgba(0,0,0,.8)}
</style></head>
<body>
<div id="stage">
  <canvas id="c" width="1080" height="1920"></canvas>
  <canvas id="rain" width="1080" height="1920"></canvas>
  <div id="hud">
    <div id="dots"><div class="dot">1</div><div class="dot">2</div><div class="dot">3</div><div class="dot">4</div><div class="dot">5</div></div>
    <div id="counter"><div id="cv"></div><div id="cl"></div></div>
    <div id="mode" class="chip"></div>
    <div id="bars"><div class="br" id="b1"><div class="bl">SUN’S SURFACE</div><div class="bt"><div class="bf"></div><div class="bv">1×</div></div></div>
      <div class="br" id="b2"><div class="bl">LIGHTNING</div><div class="bt"><div class="bf"></div><div class="bv">5×</div></div></div></div>
    <div id="title">5 lightning “facts.”<br>Only <em>1</em> is true.</div>
    <div id="guess" class="chip">GUESS WHICH ONE</div>
    <div id="lab0" class="lab"></div><div id="lab1" class="lab"></div><div id="lab2" class="lab"></div>
    <div id="claim"><div id="cn"></div><div id="ct"></div></div>
    <div id="cap"><div id="capTxt"></div><div id="src"></div></div>
    <div id="stamp"></div>
    <div id="end"><div class="e1">Which one fooled you?</div><div class="e2">COMMENT ↓</div></div>
  </div>
</div>
<script type="module">
  import { setup, renderAt, SHOTS, DURATION, FPS } from './scene.js';
  window.__ready = false;
  (async () => {
    try {
      await document.fonts.load('800 64px Inter'); await document.fonts.load('600 84px Lora'); await document.fonts.load('italic 600 84px Lora'); await document.fonts.load('800 100px "Inter Display"'); await document.fonts.load('900 100px "Inter Display"');
      const q = new URLSearchParams(location.search);
      const w = +(q.get('w') || 1080), hh = +(q.get('h') || 1920);
      window.__info = await setup(document.getElementById('c'), w, hh, { msaa: +(q.get('msaa') ?? 4), reflDiv: +(q.get('refl') || 2), prepass: q.get('pre') === '1' });
      window.renderAt = (t) => renderAt(t);
      window.__meta = { SHOTS, DURATION, FPS };
      window.__ready = true;
    } catch (e) { window.__err = String(e && e.stack || e); }
  })();
</script>
</body></html>
