<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;background:#000;overflow:hidden}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden;transform-origin:50% 45%}
  canvas{position:absolute;left:0;top:0;width:1080px;height:1920px}
  #hud{position:absolute;inset:0;pointer-events:none;color:#fff;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
  .chip{position:absolute;font-weight:800;font-size:27px;letter-spacing:.16em;padding:13px 26px;border-radius:40px;
        background:rgba(8,10,16,.55);border:1.5px solid rgba(255,255,255,.2);white-space:nowrap}
  #title{position:absolute;left:70px;right:150px;top:230px;text-align:center;font-weight:900;font-size:98px;line-height:1.02;letter-spacing:-.02em;
         text-shadow:0 6px 34px rgba(0,0,0,.9),0 0 4px rgba(0,0,0,1)}
  #title em{font-style:normal;color:#7fe3ff}
  #hint{left:50%;top:700px;transform:translateX(-50%);opacity:0;color:#ffd45e;border-color:rgba(255,212,94,.55);font-size:36px;padding:16px 34px}
  #info{left:50%;top:1446px;transform:translateX(-50%);opacity:0;color:#cfe0ff;font-size:21px;padding:9px 20px}
  #rank{position:absolute;left:0;right:140px;padding-left:70px;top:96px;text-align:center;opacity:0;white-space:nowrap}
  #rn{display:inline-block;vertical-align:middle;font-family:'Inter Display','Inter';font-weight:900;font-size:112px;line-height:1;color:#ffd45e;
      text-shadow:0 5px 30px rgba(0,0,0,.85),0 0 3px rgba(0,0,0,1);margin-right:22px}
  #rp{display:inline-block;vertical-align:middle;font-weight:900;font-size:50px;letter-spacing:.06em;text-shadow:0 4px 22px rgba(0,0,0,.9),0 0 3px rgba(0,0,0,1)}
  #counter{position:absolute;left:0;right:140px;padding-left:70px;top:236px;text-align:center;opacity:0}
  #cv{font-family:'Inter Display','Inter';font-weight:900;font-size:150px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em;color:#9fe8ff;
      text-shadow:0 5px 32px rgba(0,0,0,.8),0 0 3px rgba(0,0,0,1);white-space:nowrap}
  #cl{margin-top:12px;font-weight:800;font-size:25px;letter-spacing:.2em;color:#e6f4ff;text-shadow:0 2px 12px rgba(0,0,0,.95)}
  #thermo{position:absolute;left:30px;top:560px;width:26px;height:520px;opacity:0}
  #tube{position:absolute;left:5px;top:0;width:16px;height:500px;border-radius:9px;background:rgba(10,14,22,.55);border:2px solid rgba(255,255,255,.45);overflow:hidden}
  #merc{position:absolute;left:0;right:0;bottom:0;height:50%;background:linear-gradient(to top,#3fd0ff,#ff6a3d)}
  #bulb{position:absolute;left:-2px;top:488px;width:30px;height:30px;border-radius:50%;background:#3fd0ff;border:2px solid rgba(255,255,255,.55);box-shadow:0 0 18px #3fd0ff}
  #cap{position:absolute;left:80px;right:150px;top:1110px;padding:46px 30px;text-align:center;opacity:0;
       background:radial-gradient(ellipse at center,rgba(0,0,0,.6) 0%,rgba(0,0,0,.28) 55%,rgba(0,0,0,0) 76%)}
  #capTxt{font-weight:900;font-size:70px;line-height:1.1;letter-spacing:-.01em;text-shadow:0 5px 24px rgba(0,0,0,.9),0 0 3px rgba(0,0,0,1)}
  #capTxt b{color:#ffd45e;font-weight:900}
  #capTxt .w{display:inline-block;margin:0 .13em;transform-origin:50% 70%}
  #src{margin-top:20px;font-weight:800;font-size:23px;letter-spacing:.14em;opacity:.88;text-shadow:0 2px 10px rgba(0,0,0,.95)}
  .lab{position:absolute;transform:translate(-50%,-50%);font-weight:900;font-size:40px;letter-spacing:.1em;color:#ffd45e;white-space:nowrap;opacity:0;
       text-shadow:0 3px 18px rgba(0,0,0,.95),0 0 3px rgba(0,0,0,1)}
  .lab.small{font-size:28px;color:#fff;letter-spacing:.18em}
  #end{position:absolute;left:70px;right:140px;top:620px;text-align:center;opacity:0}
  #end .e1{font-weight:900;font-size:100px;line-height:1.02;letter-spacing:-.02em;text-shadow:0 6px 34px rgba(0,0,0,.95)}
  #end .e2{margin-top:34px;font-weight:900;font-size:44px;letter-spacing:.1em;color:#ffd45e;text-shadow:0 3px 16px rgba(0,0,0,.9)}
</style></head>
<body>
<div id="stage">
  <canvas id="c" width="1080" height="1920"></canvas>
  <div id="hud">
    <div id="rank"><span id="rn"></span><span id="rp"></span></div>
    <div id="counter"><div id="cv"></div><div id="cl"></div></div>
    <div id="thermo"><div id="tube"><div id="merc"></div></div><div id="bulb"></div></div>
    <div id="title">Where’s the <em>coldest</em> place in the universe?</div>
    <div id="hint" class="chip">HINT: #1 IS MAN-MADE</div>
    <div id="info" class="chip"></div>
    <div id="lab0" class="lab"></div><div id="lab1" class="lab"></div><div id="lab2" class="lab"></div>
    <div id="cap"><div id="capTxt"></div><div id="src"></div></div>
    <div id="end"><div class="e1">Which one shocked you most?</div><div class="e2">COMMENT ↓</div></div>
  </div>
</div>
<script type="module">
  import { setup, renderAt, SHOTS, DURATION, FPS } from './scene.js';
  window.__ready = false;
  (async () => {
    try {
      await document.fonts.load('800 64px Inter'); await document.fonts.load('900 64px Inter'); await document.fonts.load('900 100px "Inter Display"');
      const q = new URLSearchParams(location.search);
      const w = +(q.get('w') || 1080), hh = +(q.get('h') || 1920);
      window.__info = await setup(document.getElementById('c'), w, hh, { msaa: +(q.get('msaa') ?? 4), reflDiv: +(q.get('refl') || 2), prepass: q.get('pre') === '1' });
      window.renderAt = (t) => renderAt(t);
      window.__meta = { SHOTS, DURATION, FPS };
      window.__ready = true;
    } catch (e) { window.__err = String(e && e.stack || e); }
  })();
</script>
</body></html>
