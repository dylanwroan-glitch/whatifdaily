<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;background:#000;overflow:hidden}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden;transform-origin:50% 45%}
  canvas{position:absolute;left:0;top:0;width:1080px;height:1920px}
  #hud{position:absolute;inset:0;pointer-events:none;color:#fff;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
  .chip{position:absolute;font-weight:800;font-size:27px;letter-spacing:.16em;padding:13px 26px;border-radius:40px;
        background:rgba(8,10,16,.55);border:1.5px solid rgba(255,255,255,.2);white-space:nowrap}
  #title{position:absolute;left:70px;right:150px;top:230px;text-align:center;font-weight:900;font-size:100px;line-height:1.02;letter-spacing:-.02em;
         text-shadow:0 6px 34px rgba(0,0,0,.9),0 0 4px rgba(0,0,0,1)}
  #title em{font-style:normal;color:#6fd3ff}
  #hint{left:50%;top:742px;transform:translateX(-50%);opacity:0;color:#ffd45e;border-color:rgba(255,212,94,.55);font-size:38px;padding:16px 36px}
  #chip{left:50%;top:250px;transform:translateX(-50%);opacity:0;font-size:34px;padding:16px 34px;color:#fff;border-color:rgba(111,211,255,.6);background:rgba(6,18,30,.62)}
  #info{left:50%;top:1452px;transform:translateX(-50%);opacity:0;color:#cfe0ff;font-size:21px;padding:9px 20px}
  #counter{position:absolute;left:0;right:140px;padding-left:70px;top:236px;text-align:center;opacity:0}
  #cv{font-family:'Inter Display','Inter';font-weight:900;font-size:150px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em;color:#8fe0ff;
      text-shadow:0 5px 32px rgba(0,0,0,.8),0 0 3px rgba(0,0,0,1);white-space:nowrap}
  #cl{margin-top:12px;font-weight:800;font-size:25px;letter-spacing:.2em;color:#e6f4ff;text-shadow:0 2px 12px rgba(0,0,0,.95)}
  #count{position:absolute;left:0;right:140px;padding-left:70px;top:560px;text-align:center;opacity:0;font-family:'Inter Display','Inter';font-weight:900;font-size:420px;line-height:1;
         color:#ffd45e;text-shadow:0 10px 60px rgba(0,0,0,.85),0 0 6px rgba(0,0,0,1)}
  #cap{position:absolute;left:80px;right:150px;top:1110px;padding:46px 30px;text-align:center;opacity:0;
       background:radial-gradient(ellipse at center,rgba(0,0,0,.6) 0%,rgba(0,0,0,.28) 55%,rgba(0,0,0,0) 76%)}
  #capTxt{font-weight:900;font-size:70px;line-height:1.1;letter-spacing:-.01em;text-shadow:0 5px 24px rgba(0,0,0,.9),0 0 3px rgba(0,0,0,1)}
  #capTxt b{color:#ffd45e;font-weight:900}
  #capTxt .w{display:inline-block;margin:0 .13em;transform-origin:50% 70%}
  #src{margin-top:20px;font-weight:800;font-size:23px;letter-spacing:.14em;opacity:.88;text-shadow:0 2px 10px rgba(0,0,0,.95)}
  .lab{position:absolute;transform:translate(-50%,-50%);font-weight:900;font-size:40px;letter-spacing:.1em;color:#ffd45e;white-space:pre;text-align:center;line-height:1.15;opacity:0;
       text-shadow:0 3px 18px rgba(0,0,0,.95),0 0 3px rgba(0,0,0,1)}
  .lab.small{font-size:28px;color:#fff;letter-spacing:.18em}
  .lab.tiny{font-size:30px;color:#111;letter-spacing:0;text-shadow:none;font-weight:800}
  #meas{position:absolute;width:4px;opacity:0;background:#ffd45e;box-shadow:0 0 10px rgba(0,0,0,.8)}
  #meas:before,#meas:after{content:'';position:absolute;left:-14px;width:32px;height:4px;background:#ffd45e}
  #meas:before{top:0} #meas:after{bottom:0}
  #measT{position:absolute;transform:translate(-100%,-50%);font-family:'Inter Display','Inter';font-weight:900;font-size:76px;color:#ffd45e;opacity:0;white-space:nowrap;
         text-shadow:0 4px 24px rgba(0,0,0,.9),0 0 3px rgba(0,0,0,1)}
  #end{position:absolute;left:70px;right:140px;top:620px;text-align:center;opacity:0}
  #end .e1{font-weight:900;font-size:104px;line-height:1.02;letter-spacing:-.02em;text-shadow:0 6px 34px rgba(0,0,0,.95)}
  #end .e2{margin-top:34px;font-weight:900;font-size:44px;letter-spacing:.1em;color:#ffd45e;text-shadow:0 3px 16px rgba(0,0,0,.9)}
</style></head>
<body>
<div id="stage">
  <canvas id="c" width="1080" height="1920"></canvas>
  <canvas id="rain" width="1080" height="1920"></canvas>
  <div id="hud">
    <div id="counter"><div id="cv"></div><div id="cl"></div></div>
    <div id="count"></div>
    <div id="title">What if <em>all</em> the water in the sky fell at once?</div>
    <div id="hint" class="chip">WOULD WE DROWN?</div>
    <div id="chip" class="chip"></div>
    <div id="info" class="chip"></div>
    <div id="lab0" class="lab"></div><div id="lab1" class="lab"></div><div id="lab2" class="lab"></div><div id="lab3" class="lab"></div><div id="lab4" class="lab"></div><div id="lab5" class="lab"></div>
    <div id="meas"></div><div id="measT"></div>
    <div id="cap"><div id="capTxt"></div><div id="src"></div></div>
    <div id="end"><div class="e1">Did you think we’d drown?</div><div class="e2">COMMENT ↓</div></div>
  </div>
</div>
<script type="module">
  import { setup, renderAt, SHOTS, DURATION, FPS } from './scene.js';
  window.__ready = false;
  (async () => {
    try {
      await document.fonts.load('800 64px Inter'); await document.fonts.load('900 64px Inter'); await document.fonts.load('900 100px "Inter Display"');
      const q = new URLSearchParams(location.search);
      const w = +(q.get('w') || 1080), hh = +(q.get('h') || 1920);
      window.__info = await setup(document.getElementById('c'), w, hh, { msaa: +(q.get('msaa') ?? 4), reflDiv: +(q.get('refl') || 2), prepass: q.get('pre') === '1' });
      window.renderAt = (t) => renderAt(t);
      window.__meta = { SHOTS, DURATION, FPS };
      window.__ready = true;
    } catch (e) { window.__err = String(e && e.stack || e); }
  })();
</script>
</body></html>
